name: Web

# Builds the web version and publishes it to GitHub Pages (https://renzora.github.io/rainbow/),
# with a fresh copy of the Encore catalogue so visitors don't have to fetch it page by page.
# The schedule refreshes that copy hourly; the app itself is only rebuilt when its code changes.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries (for the desktop build that updates the catalogue)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The built web app, reused while its code (and the proxy address) stay the same.
      - name: Previous web build
        id: web-build
        uses: actions/cache@v4
        with:
          path: dist
          key: web-${{ hashFiles('src/**', 'web/**', 'assets/**', 'docs/**', 'Cargo.toml', 'Cargo.lock', 'tools/build_web.sh') }}-${{ vars.CH_PROXY }}
      - name: wasm-bindgen (the version in Cargo.lock)
        if: steps.web-build.outputs.cache-hit != 'true'
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Web version
        if: steps.web-build.outputs.cache-hit != 'true'
        env:
          # The Clone Hero proxy (tools/clonehero-proxy); without it the leaderboards are left out.
          RAINBOW_CH_PROXY: ${{ vars.CH_PROXY }}
        run: sh tools/build_web.sh
      - name: Catalogue
        run: |
          cargo build --release --locked
          # Start from the published copy, so only new charts are fetched.
          curl -fsSL https://renzora.github.io/rainbow/catalogue.json -o dist/catalogue.json || rm -f dist/catalogue.json
          ./target/release/rainbow --update-catalogue dist/catalogue.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
