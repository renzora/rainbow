name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/rainbow.exe dist/
          Compress-Archive -Path dist/rainbow.exe -DestinationPath rainbow-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: rainbow-windows-x64
          path: rainbow-windows-x64.zip

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Package Rainbow.app
        run: |
          APP=dist/Rainbow.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/rainbow" \
            target/aarch64-apple-darwin/release/rainbow \
            target/x86_64-apple-darwin/release/rainbow

          # Icon: build an .icns from the logo.
          ICONSET=$(mktemp -d)/icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/logo.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/icon.icns"

          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Rainbow</string>
            <key>CFBundleDisplayName</key><string>Rainbow</string>
            <key>CFBundleIdentifier</key><string>com.renzoraengine.rainbow</string>
            <key>CFBundleExecutable</key><string>rainbow</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign so Apple Silicon will run it (not notarized).
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent Rainbow.app ../rainbow-macos-universal.zip)
      - uses: actions/upload-artifact@v7
        with:
          name: rainbow-macos-universal
          path: rainbow-macos-universal.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/rainbow
          cp target/release/rainbow assets/icon-256.png README.md LICENSE dist/rainbow/
          tar -czf rainbow-linux-x64.tar.gz -C dist rainbow
      - uses: actions/upload-artifact@v7
        with:
          name: rainbow-linux-x64
          path: rainbow-linux-x64.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
