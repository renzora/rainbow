[package]
name = "rainbow"
version = "0.3.0"
edition = "2024"
description = "Search and download Clone Hero charts from Chorus Encore"
license = "MIT OR Apache-2.0"
repository = "https://github.com/renzora/rainbow"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2.38"
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sys-locale = "0.3.2"
web-time = "1.1.0"
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"

# The desktop app.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6.1", default-features = false }
dirs = "7.0.0"
pollster = "0.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
vorbis_rs = "0.5.6"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

# Unpacking Linux release downloads (.tar.gz) for the updater.
[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.1.10"
tar = "0.4.46"

# The web version (see web/ and tools/build_web.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes = "1"
console_error_panic_hook = "0.1.7"
futures-core = "0.3"
jiff = { version = "0.2.38", features = ["js"] }
js-sys = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
sys-locale = { version = "0.3.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Navigator", "HtmlCanvasElement", "HtmlElement", "UrlSearchParams", "History", "Url"] }

# The web version is built with `--profile web`: smaller rather than faster, as it's downloaded
# on every visit.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
