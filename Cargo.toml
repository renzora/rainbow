[package]
name = "rainbow"
version = "0.1.0"
edition = "2024"
description = "Search and download Clone Hero charts from Chorus Encore"
license = "MIT"
repository = "https://github.com/RenzoraEngine/rainbow"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vorbis_rs = "0.5.6"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.31"
