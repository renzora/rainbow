[package]
name = "rainbow"
version = "0.1.0"
edition = "2024"
description = "Search and download Clone Hero charts from Chorus Encore"
license = "MIT"
repository = "https://github.com/RenzoraEngine/rainbow"

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
egui_extras = "0.36.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winresource = "0.1.31"
